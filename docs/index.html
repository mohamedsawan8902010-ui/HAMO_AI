<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d1220">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="عرض تجريبي ثابت لواجهة HAMO AI -- مساعد تعليمي عربي لطلاب Android.">
    <title>HAMO AI -- عرض تجريبي</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">

    <div class="demo-banner" role="note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
        <span>عرض تجريبي للواجهة فقط -- الردود نماذج ثابتة وليست من Gemini. التطبيق الحقيقي في
            <a href="https://github.com/mohamedsawan8902010-ui/HAMO_AI" target="_blank" rel="noopener">المستودع</a>.</span>
    </div>

    <header class="top">
        <div class="logo" aria-hidden="true">H</div>
        <div class="brand">
            <h1>HAMO AI</h1>
            <p class="conn"><span class="dot on" id="dot"></span><span id="conn-text">وضع العرض التجريبي</span></p>
        </div>
        <button class="icon-btn" id="new-chat" type="button" aria-label="محادثة جديدة" title="محادثة جديدة">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
    </header>

    <div class="modes" id="modes" role="group" aria-label="نوع المساعدة"></div>

    <section class="chat" id="chat" aria-live="polite">
        <div class="welcome" id="welcome">
            <h2>جرّب الواجهة الآن -- بدون تسجيل وبدون خادم</h2>
            <ol>
                <li>نص تجريبي موجود مسبقًا في مربع الكتابة.</li>
                <li>اختر نوع المساعدة ثم أرسل.</li>
                <li>الردود هنا نماذج ثابتة لعرض الشكل والتصميم فقط.</li>
            </ol>
        </div>
        <div class="messages" id="messages"></div>
    </section>

    <form class="composer" id="chat-form">
        <button class="icon-btn" id="paste-button" type="button" aria-label="نص تجريبي" title="إدراج نص تجريبي">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6a1 1 0 0 1 1 1v2H8V4a1 1 0 0 1 1-1zM8 5H6.5A1.5 1.5 0 0 0 5 6.5v13A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-13A1.5 1.5 0 0 0 17.5 5H16"/></svg>
        </button>
        <textarea id="message-input" rows="1" maxlength="12000" placeholder="اكتب سؤالك أو الصق نصًا هنا…"></textarea>
        <button class="send" id="send-button" type="submit" aria-label="إرسال">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </button>
    </form>

    <div class="toast" id="toast" role="status" hidden></div>
</main>

<script src="markdown.js"></script>
<script src="demo.js"></script>
</body>
</html>
