plugins {
    id 'com.android.application'
}

// CI passes -PhamoVersionCode=<run number> so every build can update the previous install.
def ciVersionCode = (project.findProperty('hamoVersionCode') ?: '1').toString().toInteger()

android {
    namespace 'com.hamoai.assistant'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hamoai.assistant'
        minSdk 26
        targetSdk 34
        versionCode ciVersionCode
        versionName '0.2.0'
    }

    // A fixed DEBUG key (public password, not a secret) so new builds install over old ones.
    // Do NOT use it for a Play Store release: create your own key for that.
    signingConfigs {
        debug {
            storeFile file('hamo-debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
