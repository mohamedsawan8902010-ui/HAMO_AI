
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10131c">

    <title>HAMO AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="header">
            <div class="logo">H</div>

            <div class="brand">
                <h1>HAMO AI</h1>
                <p>Personal AI Assistant</p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span>Ready</span>
            </div>
        </header>

        <section class="chat" id="chat">

            <div class="welcome">
                <div class="welcome-icon">H</div>

                <h2>مرحباً، أنا HAMO AI</h2>

                <p>
                    مساعدك الشخصي للذكاء الاصطناعي.
                    كيف يمكنني مساعدتك اليوم؟
                </p>
            </div>

            <div class="messages" id="messages"></div>

        </section>

        <form class="input-area" id="chat-form">

            <textarea
                id="message-input"
                placeholder="اكتب رسالتك هنا..."
                rows="1"
                required
            ></textarea>

            <button type="submit" id="send-button">
                إرسال
            </button>

        </form>

        <footer class="footer">
            HAMO AI · Version 0.1.0
        </footer>

    </main>

    <script src="app.js"></script>

</body>
</html>
