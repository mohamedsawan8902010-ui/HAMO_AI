<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d1220">
    <meta name="color-scheme" content="dark">
    <title>HAMO AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">

    <header class="top">
        <div class="logo" aria-hidden="true">H</div>
        <div class="brand">
            <h1>HAMO AI</h1>
            <p class="conn"><span class="dot" id="dot"></span><span id="conn-text">جارٍ الفحص</span></p>
        </div>
        <button class="icon-btn" id="new-chat" type="button" aria-label="محادثة جديدة" title="محادثة جديدة">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="close-panel" type="button" aria-label="إغلاق النافذة" title="إغلاق" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
    </header>

    <div class="modes" id="modes" role="group" aria-label="نوع المساعدة"></div>

    <section class="chat" id="chat" aria-live="polite">
        <div class="welcome" id="welcome">
            <h2>الصق النص الذي تدرسه وأنا أشرحه لك</h2>
            <ol>
                <li>انسخ الفقرة من الصفحة.</li>
                <li>اضغط «لصق» ثم اختر نوع المساعدة.</li>
                <li>أرسل، وتابع أسئلتك في المحادثة نفسها.</li>
            </ol>
        </div>
        <div class="messages" id="messages"></div>
    </section>

    <form class="composer" id="chat-form">
        <button class="icon-btn" id="paste-button" type="button" aria-label="لصق من الحافظة" title="لصق">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6a1 1 0 0 1 1 1v2H8V4a1 1 0 0 1 1-1zM8 5H6.5A1.5 1.5 0 0 0 5 6.5v13A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-13A1.5 1.5 0 0 0 17.5 5H16"/></svg>
        </button>
        <textarea id="message-input" rows="1" maxlength="12000" placeholder="اكتب سؤالك أو الصق النص هنا…" aria-label="رسالتك"></textarea>
        <button class="send" id="send-button" type="submit" aria-label="إرسال">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </button>
    </form>

    <div class="toast" id="toast" role="status" hidden></div>
</main>

<script src="markdown.js"></script>
<script src="app.js"></script>
</body>
</html>
